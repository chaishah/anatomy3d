name: Build BodyParts3D detailed head assets

# PRs run the full geometry conversion so source selection and the official download path are validated before deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_bodyparts3d_assets.py
      - .github/workflows/build-bodyparts3d-assets.yml
  pull_request:
    branches: [main]
    paths:
      - tools/build_bodyparts3d_assets.py
      - .github/workflows/build-bodyparts3d-assets.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bodyparts3d-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mesh tooling
        run: python -m pip install --upgrade numpy scipy trimesh fast-simplification

      - name: Build detailed BodyParts3D head GLBs
        id: build
        continue-on-error: true
        run: python tools/build_bodyparts3d_assets.py --output assets/bodyparts3d

      - name: Validate generated assets
        if: steps.build.outcome == 'success'
        run: |
          for f in head-bones.glb head-arteries.glb head-veins.glb head-nerves.glb head-muscles.glb head-organs.glb; do
            test -s "assets/bodyparts3d/$f"
          done
          python -m json.tool assets/bodyparts3d/manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/bodyparts3d/manifest.json').read_text())
          minimum={'bone':18,'artery':35,'vein':22,'nerve':35,'muscle':20,'organ':25}
          for kind,n in minimum.items():
              actual=m['assets'][kind]['models']
              assert actual >= n, f'{kind}: {actual} < {n}'
          print({k:v['models'] for k,v in m['assets'].items()})
          PY
          ls -lh assets/bodyparts3d

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodyparts3d-build
          path: assets/bodyparts3d
          if-no-files-found: warn
          retention-days: 5

      - name: Commit generated BodyParts3D assets
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bodyparts3d
          if git diff --cached --quiet; then
            echo "BodyParts3D assets are already current."
          else
            git commit -m "Build detailed BodyParts3D head assets"
            git push
          fi

      - name: Configure Pages
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload generated checkout to Pages
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Fail if BodyParts3D conversion failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
