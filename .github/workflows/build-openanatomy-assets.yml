name: Build Open Anatomy head assets

# Generate registered web assets from the official SPL Head & Neck atlas.
# The workflow also deploys the generated checkout directly because pushes made
# by GITHUB_TOKEN do not trigger a second Pages workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_openanatomy_assets.py
      - .github/workflows/build-openanatomy-assets.yml
  pull_request:
    branches: [main]
    paths:
      - tools/build_openanatomy_assets.py
      - .github/workflows/build-openanatomy-assets.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: openanatomy-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mesh tooling
        run: python -m pip install --upgrade numpy scipy trimesh vtk

      - name: Build registered SPL Head & Neck GLBs
        id: build
        continue-on-error: true
        run: python tools/build_openanatomy_assets.py --output assets/openanatomy

      - name: Validate generated assets
        if: steps.build.outcome == 'success'
        run: |
          test -s assets/openanatomy/head-bones.glb
          test -s assets/openanatomy/head-arteries.glb
          test -s assets/openanatomy/head-veins.glb
          python -m json.tool assets/openanatomy/manifest.json >/dev/null
          ls -lh assets/openanatomy

      - name: Upload build output for validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openanatomy-build
          path: assets/openanatomy
          if-no-files-found: warn
          retention-days: 3

      - name: Commit generated assets or diagnostic report
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/openanatomy 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Build registered Open Anatomy head assets"
            git push
          fi

      - name: Configure Pages
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload site to Pages
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy generated atlas site
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if atlas conversion failed
        if: steps.build.outcome == 'failure'
        run: exit 1
