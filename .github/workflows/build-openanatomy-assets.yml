name: Build Open Anatomy head assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_openanatomy_assets.py
      - .github/workflows/build-openanatomy-assets.yml

permissions:
  contents: write

concurrency:
  group: openanatomy-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install mesh tooling
        run: python -m pip install --upgrade numpy trimesh vtk

      - name: Build registered SPL Head & Neck GLBs
        id: build
        continue-on-error: true
        run: python tools/build_openanatomy_assets.py --output assets/openanatomy

      - name: Validate generated assets
        if: steps.build.outcome == 'success'
        run: |
          test -s assets/openanatomy/head-bones.glb
          test -s assets/openanatomy/head-arteries.glb
          test -s assets/openanatomy/head-veins.glb
          python -m json.tool assets/openanatomy/manifest.json >/dev/null
          ls -lh assets/openanatomy

      - name: Commit generated assets or diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/openanatomy 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Build registered Open Anatomy head assets"
            git push
          fi

      - name: Fail if atlas conversion failed
        if: steps.build.outcome == 'failure'
        run: exit 1
